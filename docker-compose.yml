version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: do-and-done-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-doandone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doandone123}
      POSTGRES_DB: ${DB_NAME:-doandone}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-doandone}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: do-and-done-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
